[package]
name = "blaze"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arc-swap = "1.9.2"
arrow-array = "59.1.0"
arrow-buffer = "59.1.0"
arrow-ord = "59.1.0"
arrow-schema = "59.1.0"
arrow-select = "59.1.0"
axum = "0.8.9"
bytes = "1.12.1"
clap = { version = "4.6.2", features = ["derive"] }
dashmap = "6.2.1"
futures = "0.3.33"
k8s-openapi = { version = "0.28.0", features = ["latest"], optional = true }
kube = { version = "4.0.0", default-features = false, features = ["client", "rustls-tls"], optional = true }
libc = "0.2.189"
memmap2 = "0.9.11"
object_store = { version = "0.14.1", features = ["aws"] }
parking_lot = "0.12.5"
parquet = { version = "59.1.0", features = ["arrow"] }
prost = "0.14.4"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
smallvec = { version = "1.15.2", features = ["serde"] }
thiserror = "2.0.19"
tokio = { version = "1.53.0", features = ["full"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.0", features = ["v4"] }

[dev-dependencies]
async-trait = "0.1.91"
http-body-util = "0.1.4"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
# A real S3 implementation to run the conformance suite against in CI, so the
# check itself is tested rather than only its fakes.
s3s = "0.14.1"
s3s-fs = { version = "0.14.1", default-features = false }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "tokio"] }

[features]
default = []
k8s = ["dep:kube", "dep:k8s-openapi"]

[profile.release]
lto = "thin"
codegen-units = 1

[build-dependencies]
protox = "0.9.1"
tonic-prost-build = "0.14.6"
