name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `labeled` is here so that adding the `e2e` label to an open pull request
    # re-runs the workflow and picks up the oracle job. Listing types at all
    # replaces the default set, so the other three have to be spelled out.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Any label re-triggers the workflow, not just `e2e`, so supersede the previous
# run on a pull request rather than building the same commit repeatedly. Pushes
# to main are left alone: each one is a distinct commit worth its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: test + k8s feature check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --all-targets

      - name: cargo check --features k8s
        run: cargo check --features k8s

  # Gated behind the `e2e` label on pull requests: it builds the binary in
  # release, starts it, restarts it mid-stream and queries it back, so it costs
  # minutes rather than seconds. It still runs unconditionally on every push to
  # main, which is the part that matters — a labelled-only check would let a
  # regression through on any pull request nobody thought to label, and this is
  # the one test that grades us against something we did not write.
  oracle:
    name: connected components vs scipy
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scipy
        run: pip install --quiet scipy numpy

      # The dataset is vendored under tests/data, so this needs no network of
      # its own. `api` mode starts the real binary, ingests over HTTP, restarts
      # it mid-stream so the second half is served on top of state hydrated from
      # the catalog, and queries back through the API.
      - name: Grade against scipy
        run: python3 tools/cc_oracle.py --dataset words --scopes 4 --global-share 0.3
